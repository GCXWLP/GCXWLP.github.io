<br><span class="line">184</span><br><span class="line">185</span><br><span class="line">186</span><br><span class="line">187</span><br><span class="line">188</span><br><span class="line">189</span><br></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span> <span class="string">&lt;stdio.h&gt;</span></span></span><br><span class="line"></span><br><span class="line"><span class="meta">#<span class="keyword">define</span> NUM_TASKS 5</span></span><br><span class="line"><span class="meta">#<span class="keyword">define</span> MEMORY_CAPACITY 100   <span class="comment">// 用户可用主存(K)</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">define</span> TAPE_CAPACITY     4     <span class="comment">// 磁带机台数</span></span></span><br><span class="line"></span><br><span class="line"><span class="keyword">typedef</span> <span class="keyword">struct</span> &#123;</span><br><span class="line">    <span class="type">const</span> <span class="type">char</span>* name;</span><br><span class="line">    <span class="type">int</span> nArrivalTime;      <span class="comment">// 到达时刻（从 00:00 起的分钟）</span></span><br><span class="line">    <span class="type">int</span> nServiceTime;      <span class="comment">// 运行时间（分钟）</span></span><br><span class="line">    <span class="type">int</span> nMemoryNeed;     <span class="comment">// 主存需求</span></span><br><span class="line">    <span class="type">int</span> nTapesNeed;        <span class="comment">// 磁带机需求（台）</span></span><br><span class="line"></span><br><span class="line">    <span class="type">int</span> nAdmittedTime;     <span class="comment">// 进入系统（分到内存+磁带）时刻；-1 表示尚未进入</span></span><br><span class="line">    <span class="type">int</span> nStartTime;        <span class="comment">// 获得CPU的时刻</span></span><br><span class="line">    <span class="type">int</span> nFinishTime;       <span class="comment">// 完成时刻</span></span><br><span class="line">&#125; Task;</span><br><span class="line"></span><br><span class="line"><span class="comment">/* </span></span><br><span class="line"><span class="comment">返回t之后的下一次到达时刻；若不存在返回 -1 </span></span><br><span class="line"><span class="comment">*/</span></span><br><span class="line"><span class="function"><span class="type">int</span> <span class="title">NextArrivalTimeAfter</span><span class="params">(<span class="type">const</span> Task tasks[], <span class="type">int</span> n, <span class="type">int</span> t)</span> </span></span><br><span class="line"><span class="function"></span>&#123;</span><br><span class="line">    <span class="type">int</span> nNextTime = <span class="number">-1</span>;</span><br><span class="line">    <span class="keyword">for</span> (<span class="type">int</span> i = <span class="number">0</span>; i &lt; n; ++i) </span><br><span class="line">    &#123;</span><br><span class="line">        <span class="keyword">if</span> (tasks[i].nAdmittedTime == <span class="number">-1</span> &amp;&amp; tasks[i].nArrivalTime &gt; t) </span><br><span class="line">        &#123;</span><br><span class="line">            <span class="keyword">if</span> (nNextTime == <span class="number">-1</span> || tasks[i].nArrivalTime &lt; nNextTime) </span><br><span class="line">            &#123;</span><br><span class="line">                nNextTime = tasks[i].nArrivalTime;</span><br><span class="line">            &#125;</span><br><span class="line">        &#125;</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">return</span> nNextTime;</span><br><span class="line">&#125;</span><br><span class="line"></span><br><span class="line"><span class="comment">/* 在当前时刻 nCurrentTime，尽可能让已到达的作业进入系统（分配内存和磁带）</span></span><br><span class="line"><span class="comment">   - 主存可变分区且允许紧凑：只需比较“剩余总内存”是否足够</span></span><br><span class="line"><span class="comment">   - 磁带机静态分配：进入系统后一直占用到完成为止</span></span><br><span class="line"><span class="comment">   进入系统的作业按 FCFS 顺序入就绪队列。*/</span></span><br><span class="line"><span class="function"><span class="type">void</span> <span class="title">AdmitArrivedTasks</span><span class="params">(</span></span></span><br><span class="line"><span class="params"><span class="function">    Task tasks[], <span class="type">int</span> n, <span class="type">int</span> nCurrentTime,</span></span></span><br><span class="line"><span class="params"><span class="function">    <span class="type">int</span>* nFreeMemory, <span class="type">int</span>* nFreeTapes,</span></span></span><br><span class="line"><span class="params"><span class="function">    <span class="type">int</span> ReadyQueue[], <span class="type">int</span>* nReadyTail)</span> </span></span><br><span class="line"><span class="function"></span>&#123;</span><br><span class="line">    <span class="keyword">for</span> (<span class="type">int</span> i = <span class="number">0</span>; i &lt; n; ++i) </span><br><span class="line">    &#123;</span><br><span class="line">        <span class="keyword">if</span> (tasks[i].nAdmittedTime == <span class="number">-1</span> &amp;&amp; tasks[i].nArrivalTime &lt;= nCurrentTime) </span><br><span class="line">        &#123;</span><br><span class="line">            <span class="keyword">if</span> (tasks[i].nMemoryNeed &lt;= *nFreeMemory &amp;&amp;</span><br><span class="line">                tasks[i].nTapesNeed &lt;= *nFreeTapes) </span><br><span class="line">            &#123;</span><br><span class="line">                *nFreeMemory -= tasks[i].nMemoryNeed; <span class="comment">// 占用资源</span></span><br><span class="line">                *nFreeTapes -= tasks[i].nTapesNeed;</span><br><span class="line">                tasks[i].nAdmittedTime = nCurrentTime;</span><br><span class="line">                ReadyQueue[(*nReadyTail)++] = i;  <span class="comment">// 进入就绪队列</span></span><br><span class="line">            &#125;</span><br><span class="line">        &#125;</span><br><span class="line">    &#125;</span><br><span class="line">&#125;</span><br><span class="line"></span><br><span class="line"><span class="function"><span class="type">void</span> <span class="title">PrintTime</span><span class="params">(<span class="type">int</span> nMinutes)</span> </span></span><br><span class="line"><span class="function"></span>&#123;</span><br><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;%02d:%02d&quot;</span>, nMinutes / <span class="number">60</span>, nMinutes % <span class="number">60</span>);</span><br><span class="line">&#125;</span><br><span class="line"></span><br><span class="line"><span class="function"><span class="type">int</span> <span class="title">main</span><span class="params">(<span class="type">void</span>)</span> </span></span><br><span class="line"><span class="function"></span>&#123;</span><br><span class="line">    Task tasks[NUM_TASKS] = </span><br><span class="line">    &#123;</span><br><span class="line">        &#123;<span class="string">&quot;JOB1&quot;</span>, <span class="number">10</span> * <span class="number">60</span> + <span class="number">0</span>, <span class="number">40</span>, <span class="number">35</span>, <span class="number">3</span>, <span class="number">-1</span>, <span class="number">-1</span>, <span class="number">-1</span>&#125;,</span><br><span class="line">        &#123;<span class="string">&quot;JOB2&quot;</span>, <span class="number">10</span> * <span class="number">60</span> + <span class="number">10</span>, <span class="number">30</span>, <span class="number">70</span>, <span class="number">1</span>, <span class="number">-1</span>, <span class="number">-1</span>, <span class="number">-1</span>&#125;,</span><br><span class="line">        &#123;<span class="string">&quot;JOB3&quot;</span>, <span class="number">10</span> * <span class="number">60</span> + <span class="number">15</span>, <span class="number">20</span>, <span class="number">50</span>, <span class="number">3</span>, <span class="number">-1</span>, <span class="number">-1</span>, <span class="number">-1</span>&#125;,</span><br><span class="line">        &#123;<span class="string">&quot;JOB4&quot;</span>, <span class="number">10</span> * <span class="number">60</span> + <span class="number">35</span>, <span class="number">10</span>, <span class="number">25</span>, <span class="number">2</span>, <span class="number">-1</span>, <span class="number">-1</span>, <span class="number">-1</span>&#125;,</span><br><span class="line">        &#123;<span class="string">&quot;JOB5&quot;</span>, <span class="number">10</span> * <span class="number">60</span> + <span class="number">40</span>,  <span class="number">5</span>, <span class="number">20</span>, <span class="number">2</span>, <span class="number">-1</span>, <span class="number">-1</span>, <span class="number">-1</span>&#125;,</span><br><span class="line">    &#125;;</span><br><span class="line"></span><br><span class="line">    <span class="type">int</span> nFreeMemory = MEMORY_CAPACITY;</span><br><span class="line">    <span class="type">int</span> nFreeTapes = TAPE_CAPACITY;</span><br><span class="line"></span><br><span class="line">    <span class="type">int</span> ReadyQueue[NUM_TASKS];     <span class="comment">// 就绪队列</span></span><br><span class="line">    <span class="type">int</span> nReadyHead = <span class="number">0</span>;</span><br><span class="line">    <span class="type">int</span> nReadyTail = <span class="number">0</span>;</span><br><span class="line"></span><br><span class="line">    <span class="type">int</span> nExecutionOrder[NUM_TASKS]; <span class="comment">// CPU 实际执行顺序</span></span><br><span class="line">    <span class="type">int</span> nExecutionCount = <span class="number">0</span>;</span><br><span class="line"></span><br><span class="line">    <span class="type">int</span> nRemainingTasks = NUM_TASKS;</span><br><span class="line">    <span class="type">int</span> nCurrentTime = <span class="number">-1</span>;</span><br><span class="line">    <span class="type">int</span> nRunningTask = <span class="number">-1</span>;                   <span class="comment">// 当前在CPU上的作业索引，-1表示空闲</span></span><br><span class="line">    <span class="type">int</span> nPlannedFinishTime = <span class="number">0</span>;</span><br><span class="line"></span><br><span class="line">    <span class="keyword">while</span> (nRemainingTasks &gt; <span class="number">0</span>) </span><br><span class="line">    &#123;</span><br><span class="line">        <span class="comment">// 若 CPU 空闲且就绪队列也空，则时间推进到“下一次到达”</span></span><br><span class="line">        <span class="keyword">if</span> (nRunningTask == <span class="number">-1</span> &amp;&amp; nReadyHead == nReadyTail) </span><br><span class="line">        &#123;</span><br><span class="line">            <span class="type">int</span> nNextArrivalTime = <span class="built_in">NextArrivalTimeAfter</span>(tasks, NUM_TASKS, nCurrentTime);</span><br><span class="line">            nCurrentTime = nNextArrivalTime;</span><br><span class="line">            <span class="built_in">AdmitArrivedTasks</span>(tasks, NUM_TASKS, nCurrentTime,</span><br><span class="line">                                &amp;nFreeMemory, &amp;nFreeTapes,</span><br><span class="line">                                ReadyQueue, &amp;nReadyTail);</span><br><span class="line">        &#125;</span><br><span class="line"></span><br><span class="line">        <span class="comment">// 有就绪作业则按FCFS取队头运行</span></span><br><span class="line">        <span class="keyword">if</span> (nRunningTask == <span class="number">-1</span> &amp;&amp; nReadyHead != nReadyTail) </span><br><span class="line">        &#123;</span><br><span class="line">            <span class="type">int</span> nTaskId = ReadyQueue[nReadyHead++];</span><br><span class="line">            tasks[nTaskId].nStartTime = nCurrentTime;</span><br><span class="line">            tasks[nTaskId].nFinishTime = nCurrentTime + tasks[nTaskId].nServiceTime;</span><br><span class="line">            nRunningTask = nTaskId;</span><br><span class="line">            nPlannedFinishTime = tasks[nTaskId].nFinishTime;</span><br><span class="line">            nExecutionOrder[nExecutionCount++] = nTaskId;</span><br><span class="line">        &#125;</span><br><span class="line"></span><br><span class="line">        <span class="comment">// 到达与完成事件处理</span></span><br><span class="line">        <span class="keyword">if</span> (nRunningTask != <span class="number">-1</span>) </span><br><span class="line">        &#123;</span><br><span class="line">            <span class="type">int</span> nNextArrivalTime = <span class="built_in">NextArrivalTimeAfter</span>(tasks, NUM_TASKS, nCurrentTime); <span class="comment">// nCurrentTime返回下一个JOB</span></span><br><span class="line">            <span class="comment">// 遍历在当前JOB结束之前是否有后续JOB满足条件</span></span><br><span class="line">            <span class="keyword">if</span> (nNextArrivalTime != <span class="number">-1</span> &amp;&amp; nNextArrivalTime &lt;= nPlannedFinishTime) </span><br><span class="line">            &#123;</span><br><span class="line">                <span class="comment">// 运行期间有新作业到达，尝试装入</span></span><br><span class="line">                nCurrentTime = nNextArrivalTime;</span><br><span class="line">                <span class="built_in">AdmitArrivedTasks</span>(tasks, NUM_TASKS, nCurrentTime,</span><br><span class="line">                                    &amp;nFreeMemory, &amp;nFreeTapes,</span><br><span class="line">                                    ReadyQueue, &amp;nReadyTail);</span><br><span class="line">                <span class="keyword">continue</span>; <span class="comment">// 再找</span></span><br><span class="line">            &#125;</span><br><span class="line"></span><br><span class="line">            <span class="comment">// 作业完成</span></span><br><span class="line">            nCurrentTime = nPlannedFinishTime;</span><br><span class="line">            tasks[nRunningTask].nFinishTime = nCurrentTime;</span><br><span class="line"></span><br><span class="line">            <span class="comment">// 释放资源</span></span><br><span class="line">            nFreeMemory += tasks[nRunningTask].nMemoryNeed;</span><br><span class="line">            nFreeTapes += tasks[nRunningTask].nTapesNeed;</span><br><span class="line"></span><br><span class="line">            nRunningTask = <span class="number">-1</span>; <span class="comment">// CPU恢复空闲</span></span><br><span class="line">            nRemainingTasks--;</span><br><span class="line"></span><br><span class="line">            <span class="comment">// 作业完成后可能使等待作业得以装入</span></span><br><span class="line">            <span class="built_in">AdmitArrivedTasks</span>(tasks, NUM_TASKS, nCurrentTime,</span><br><span class="line">                                &amp;nFreeMemory, &amp;nFreeTapes,</span><br><span class="line">                                ReadyQueue, &amp;nReadyTail);</span><br><span class="line">        &#125;</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="comment">// 输出执行顺序</span></span><br><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;作业执行顺序： &quot;</span>);</span><br><span class="line">    <span class="keyword">for</span> (<span class="type">int</span> i = <span class="number">0</span>; i &lt; nExecutionCount; ++i) </span><br><span class="line">    &#123;</span><br><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;%s%s&quot;</span>, tasks[nExecutionOrder[i]].name,</span><br><span class="line">            (i + <span class="number">1</span> &lt; nExecutionCount ? <span class="string">&quot;  &quot;</span> : <span class="string">&quot;&quot;</span>));</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="built_in">printf</span>(<span class="string">&quot;\n&quot;</span>);</span><br><span class="line"></span><br><span class="line">    <span class="comment">// 输出每个作业的到达—完成、周转与带权周转</span></span><br><span class="line">    <span class="keyword">for</span> (<span class="type">int</span> i = <span class="number">0</span>; i &lt; NUM_TASKS; ++i) </span><br><span class="line">    &#123;</span><br><span class="line">        <span class="type">int</span> nTurnaround = tasks[i].nFinishTime - tasks[i].nArrivalTime;</span><br><span class="line">        <span class="type">double</span> weighted = (<span class="type">double</span>)nTurnaround / tasks[i].nServiceTime;</span><br><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;%s：&quot;</span>, tasks[i].name);</span><br><span class="line">        <span class="built_in">PrintTime</span>(tasks[i].nArrivalTime);</span><br><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;&quot;</span>);</span><br><span class="line">        <span class="built_in">PrintTime</span>(tasks[i].nFinishTime);</span><br><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;周转时间：%d  带权周转时间：%.2f\n&quot;</span>, nTurnaround, weighted);</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><br><span class="line">&#125;–</span><br><span class="line"><span class="comment">/*</span></span><br><span class="line"><span class="comment">在本题我们使用了队列与贪心算法</span></span><br><span class="line"><span class="comment">1. 维护一个就绪队列(ReadyQueue)，按实际被系统接受(资源足够)进入队列的顺序</span></span><br><span class="line"><span class="comment">2. 使用贪心算法，表现在谁先到、且资源够，就立即进入系统</span></span><br><span class="line"><span class="comment"></span></span><br><span class="line"><span class="comment">就绪队列用于记录已经成功进入系统的作业（即内存和磁带机资源均满足要求）</span></span><br><span class="line"><span class="comment">模拟执行：</span></span><br><span class="line"><span class="comment">JOB1(35,3)运行期间剩余(65,1)没有任何新作业能进入就绪队列</span></span><br><span class="line"><span class="comment">JOB1释放后，剩余(100,4)</span></span><br><span class="line"><span class="comment">JOB2(70,1)运行期间剩余(30，3)，JOB4(25,2)进入就绪队列，剩余(5,1)，此时没有任何新作业能进入就绪队列</span></span><br><span class="line"><span class="comment">JOB2释放后，剩余(75,2)</span></span><br><span class="line"><span class="comment">JOB4(25,2)运行期间剩余(75,2)，JOB5(20,2)进入就绪队列，剩余(55,0)，没有任何新作业能进入就绪队列</span></span><br><span class="line"><span class="comment">JOB4释放后，剩余(80,2)，JOB3(50,3)无法进入队列</span></span><br><span class="line"><span class="comment">JOB5释放后，剩余(100,4)，JOB3进入队列</span></span><br><span class="line"><span class="comment">JOB3执行</span></span><br><span class="line"><span class="comment">结束</span></span><br><span class="line"><span class="comment">*/</span></span><br></pre></td></tr></table></figure>
